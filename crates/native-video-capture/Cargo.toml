[package]
name = "ctdozlite-native-video-capture"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
nokhwa = { version = "=0.10.11", default-features = false, features = ["input-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
